name: Fun Holidays

on:
  schedule:
    # Morning: 16:15 UTC = 8:15am PST (9:15am PDT in summer — DST shift
    # accepted). Right after muni (16:00), whose arrival times go stale.
    - cron: "15 16 * * *"
    # Midday: 20:00 UTC = 12:00pm PST (1:00pm PDT). Between the morning
    # run and dinner_menu (00:30).
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Skip if GitHub fired this cron hours late (avoids posting stale
      # content at the wrong time of day / into quiet hours -> 423).
      - id: guard
        if: github.event_name == 'schedule'
        run: echo "fresh=$(python -m vestaboard.cron_guard '${{ github.event.schedule }}')" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'schedule' || steps.guard.outputs.fresh == 'yes'
        run: python -m channels.fun_holidays --post
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
