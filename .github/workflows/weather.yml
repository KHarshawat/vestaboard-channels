name: Weather

on:
  schedule:
    # Morning: 15:15 UTC = 7:15am PST (8:15am PDT in summer — DST shift
    # accepted). After letter_of_the_day (15:00); pages post 10 min apart
    # (today 7:15, timeline 7:25, 5-day 7:35, conditionals 7:45/7:55)
    # filling the hour until muni at 8:00.
    - cron: "15 15 * * *"
    # Evening: 04:30 UTC = 8:30pm PST (9:30pm PDT). Posts: tomorrow's
    # forecast, plus an alert page if NWS has one active.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      sequence:
        description: Which sequence to post
        type: choice
        options: [morning, evening]
        default: morning

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Skip if GitHub fired this cron hours late (avoids posting stale
      # content at the wrong time of day / into quiet hours -> 423).
      - id: guard
        if: github.event_name == 'schedule'
        run: echo "fresh=$(python -m vestaboard.cron_guard '${{ github.event.schedule }}')" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'schedule' || steps.guard.outputs.fresh == 'yes'
        run: python -m channels.weather --post --view ${{ inputs.sequence || (github.event.schedule == '30 4 * * *' && 'evening' || 'morning') }}
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
