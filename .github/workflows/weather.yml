name: Weather

on:
  schedule:
    # Morning: 14:30 UTC = 7:30am PDT (6:30am PST in winter — DST shift
    # accepted). Staggered after letter_of_the_day (14:00) so posts
    # don't collide. Posts: today, timeline, 5-day, then rain/heat/
    # alerts/AQI pages only when conditions warrant.
    - cron: "30 14 * * *"
    # Evening: 04:30 UTC = 8:30pm PST (9:30pm PDT). Posts: tomorrow's
    # forecast, plus an alert page if NWS has one active.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      sequence:
        description: Which sequence to post
        type: choice
        options: [morning, evening]
        default: morning

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m channels.weather --post --view ${{ inputs.sequence || (github.event.schedule == '30 4 * * *' && 'evening' || 'morning') }}
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
