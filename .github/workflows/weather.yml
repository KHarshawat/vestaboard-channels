name: Weather

# Manual fallback only. The schedule moved to the Cloudflare Worker in
# worker/ (see worker/src/schedule.ts); GitHub's cron fired 4-8 hours late.
on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Which sequence to post
        type: choice
        options: [morning, evening]
        default: morning

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m channels.weather --post --view ${{ inputs.sequence }}
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
