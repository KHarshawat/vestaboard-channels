name: Muni

# Manual fallback only. The schedule moved to the Cloudflare Worker in
# worker/ (see worker/src/schedule.ts); GitHub's cron fired 4-8 hours late.
on:
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m channels.muni --post
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
          TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}
