name: Muni

on:
  schedule:
    # 16:00 UTC = 8:00am PST (9:00am PDT in summer — DST shift accepted).
    - cron: "0 16 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m channels.muni --post
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
          TRANSIT_511_API_KEY: ${{ secrets.TRANSIT_511_API_KEY }}
