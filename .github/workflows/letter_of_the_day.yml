name: Letter of the Day

on:
  schedule:
    # 15:00 UTC = 7:00am PST (8:00am PDT in summer — DST shift accepted).
    # Opens the 7-8am block: letter, then weather pages until muni at 8.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Skip if GitHub fired this cron hours late (avoids posting stale
      # content at the wrong time of day / into quiet hours -> 423).
      - id: guard
        if: github.event_name == 'schedule'
        run: echo "fresh=$(python -m vestaboard.cron_guard '${{ github.event.schedule }}')" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'schedule' || steps.guard.outputs.fresh == 'yes'
        run: python -m channels.letter_of_the_day --post
        env:
          VESTABOARD_TOKEN: ${{ secrets.VESTABOARD_TOKEN }}
